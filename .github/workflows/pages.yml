name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Drop maintainer docs and the unpublished wiki from the published site
        # The artifact is the repo root verbatim, so working notes would ship as
        # crawlable pages. robots.txt cannot exclude them: crawlers only read the
        # host-root robots.txt, and this is a project site at /exodus-wiki/, so the
        # one deployed here is never consulted. Excluding at publish time is the
        # only mechanism that actually works. Affects the runner's checkout only —
        # the files stay in the repository, which is public and stays that way.
        #
        # exodus-the-helium-sea goes entirely, not just its docs: it is a scaffold
        # with no article coverage, and an empty wiki indexed as thin content would
        # cost the site that is deliberately built to be found. Remove this path
        # when it has articles — see
        # docs/superpowers/specs/2026-07-25-exodus-helium-sea-scaffold-design.md.
        run: rm -rf docs exodus-the-archimedes-engine/docs exodus-the-helium-sea
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
